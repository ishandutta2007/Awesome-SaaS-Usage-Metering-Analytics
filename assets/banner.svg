<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>

    <!-- Filter for Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 12;
      animation: dash 18s linear infinite;
    }
    .pulse-card {
      animation: float 6s ease-in-out infinite alternate;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -200;
      }
    }
    @keyframes pulse {
      0% { opacity: 0.25; transform: scale(0.98); }
      100% { opacity: 0.6; transform: scale(1.02); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #94a3b8;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Animated Ambient Glow Blobs in Background (Non-intrusive) -->
  <g class="pulse-circle">
    <circle cx="150" cy="80" r="120" fill="#0284c7" opacity="0.18" filter="url(#glow)" />
    <circle cx="1060" cy="120" r="140" fill="#7c3aed" opacity="0.18" filter="url(#glow)" />
    <circle cx="600" cy="300" r="160" fill="#0d9488" opacity="0.12" filter="url(#glow)" />
  </g>

  <!-- Flowing Tech Metering Data Streams (Behind text) -->
  <g opacity="0.35">
    <path class="flow-line" d="M -50,110 Q 300,50 600,120 T 1250,90" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-line" d="M -50,260 Q 350,330 750,250 T 1250,280" fill="none" stroke="#a855f7" stroke-width="2" />
    <path class="flow-line" d="M -50,60 C 250,180 850,-20 1250,160" fill="none" stroke="#06b6d4" stroke-width="1.5" />
  </g>

  <!-- Decorative Minimalist Corner Cards (Usage / Rate Limits) -->
  <g class="pulse-card" transform="translate(930, 45)" opacity="0.75">
    <rect width="210" height="75" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="28" r="8" fill="#10b981" />
    <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">REALTIME METERING</text>
    <text x="22" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">12.4M Events / sec · 99.99%</text>
  </g>

  <g class="pulse-card" transform="translate(60, 245)" opacity="0.75">
    <rect width="220" height="70" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="28" r="8" fill="#38bdf8" />
    <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">USAGE-BASED BILLING</text>
    <text x="22" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Entitlements &amp; Prepaid Credits</text>
  </g>

  <!-- Primary Foreground Content (Never hidden, maximum readability) -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Super-header / category pill -->
    <rect x="-180" y="-88" width="360" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.9" />
    <text x="0" y="-68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2">CURATED ARCHITECTURE DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="-12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      ⚡ Awesome SaaS Usage &amp; Metering Analytics 💳
    </text>

    <!-- Subtitle -->
    <text x="0" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1">
      Consumption Tracking • Real-Time Rating • Dynamic Entitlements • Open-Source &amp; Enterprise Platforms
    </text>

    <!-- Interactive Badges Pill Row -->
    <g transform="translate(0, 68)">
      <rect x="-260" y="0" width="115" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="-202" y="19" text-anchor="middle" class="badge-text">📊 Real-Time</text>

      <rect x="-130" y="0" width="125" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="-67" y="19" text-anchor="middle" class="badge-text">🤖 AI / LLM Tokens</text>

      <rect x="10" y="0" width="115" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="67" y="19" text-anchor="middle" class="badge-text">⚖️ Entitlements</text>

      <rect x="140" y="0" width="120" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="200" y="19" text-anchor="middle" class="badge-text">🔓 Open-Source</text>
    </g>
  </g>

  <!-- Accent bottom gradient bar -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#accentGlow)" />
</svg>
